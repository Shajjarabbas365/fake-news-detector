<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TruthLens</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            /* ===== Token system: "Verification Lab" ===== */
            --void:        #0a1512;
            --void-deep:    #071009;
            --panel:       #10201b;
            --panel-soft:  #142720;
            --line:        rgba(201,169,97,0.16);
            --line-bright: rgba(201,169,97,0.34);
            --ink:         #eef1ea;
            --ink-soft:    #90a49b;
            --ink-faint:   #5f7168;
            --gold:        #c9a961;
            --gold-bright: #e8c988;
            --verified:    #3ddc97;
            --flagged:     #ff5c72;
            --review:      #ffb238;
        }

        *{ box-sizing:border-box; }

        @media (prefers-reduced-motion: reduce){
            *,*::before,*::after{
                animation-duration:0.001ms !important;
                animation-iteration-count:1 !important;
                transition-duration:0.001ms !important;
                scroll-behavior:auto !important;
            }
        }

        html{ scroll-behavior:smooth; }

        body{
            margin:0;
            min-height:100vh;
            font-family:'Inter', sans-serif;
            color:var(--ink);
            background:
                radial-gradient(circle at 18% -8%, rgba(201,169,97,0.10), transparent 42%),
                radial-gradient(circle at 88% 12%, rgba(61,220,151,0.06), transparent 40%),
                linear-gradient(180deg, var(--void-deep) 0%, var(--void) 100%);
            background-attachment:fixed;
            position:relative;
        }

        /* faint instrumentation grid */
        body::before{
            content:'';
            position:fixed; inset:0;
            background-image:
                linear-gradient(rgba(201,169,97,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,169,97,0.035) 1px, transparent 1px);
            background-size:42px 42px;
            mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black, transparent 75%);
            pointer-events:none;
            z-index:0;
        }

        .mono{ font-family:'JetBrains Mono', monospace; }

        /* ---------- Header ---------- */
        .main-header{
            position:relative;
            z-index:2;
            padding:26px 24px 0;
        }
        .header-inner{
            max-width:920px;
            margin:0 auto;
            display:flex;
            align-items:center;
        }
        .header-brand{
            display:flex;
            align-items:center;
            gap:12px;
            text-decoration:none;
            color:var(--ink);
        }
        .brand-mark{
            width:38px; height:38px;
            border-radius:50%;
            display:grid; place-items:center;
            background:conic-gradient(from 180deg, var(--gold), transparent 65%, var(--gold));
            padding:1px;
        }
        .brand-mark span{
            width:100%; height:100%;
            border-radius:50%;
            background:var(--void-deep);
            display:grid; place-items:center;
            color:var(--gold-bright);
            font-size:15px;
        }
        .brand-word{
            font-family:'Fraunces', serif;
            font-weight:600;
            font-size:22px;
            letter-spacing:0.2px;
        }
        .brand-word em{ font-style:normal; color:var(--gold-bright); }

        /* ---------- Centered access wrap ---------- */
        .access-wrap{
            position:relative;
            z-index:2;
            min-height:calc(100vh - 90px);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 20px 60px;
        }

        .access-card{
            position:relative;
            overflow:hidden;
            width:100%;
            max-width:430px;
            background:linear-gradient(180deg, var(--panel-soft), var(--panel));
            border:1px solid var(--line);
            border-radius:18px;
            padding:40px 36px 34px;
            box-shadow:0 30px 60px -35px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.03);
            animation:riseIn 0.7s 0.08s cubic-bezier(.2,.8,.2,1) both;
        }

        .access-eyebrow{
            font-family:'JetBrains Mono', monospace;
            font-size:11px;
            letter-spacing:2.5px;
            text-transform:uppercase;
            color:var(--gold);
            text-align:center;
            display:block;
            margin-bottom:22px;
        }

        .access-badge{
            width:72px; height:72px;
            border-radius:50%;
            position:relative;
            display:grid;
            place-items:center;
            margin:0 auto 22px;
            background:radial-gradient(circle at 50% 40%, rgba(255,255,255,0.08), transparent 60%), var(--void-deep);
            border:2px solid var(--gold-bright);
            animation:badgeIn 0.55s 0.15s cubic-bezier(.2,1.3,.4,1) both;
        }
        .access-badge::after{
            content:'';
            position:absolute;
            inset:-7px;
            border-radius:50%;
            border:1px dashed var(--gold);
            opacity:0.5;
            animation:badgeRotate 16s linear infinite;
        }
        .access-badge i{ font-size:24px; color:var(--gold-bright); }

        .access-card h2{
            font-family:'Fraunces', serif;
            font-weight:600;
            font-size:24px;
            text-align:center;
            line-height:1.3;
            margin:0 0 10px;
        }

        .access-tagline{
            text-align:center;
            color:var(--ink-soft);
            font-size:14px;
            line-height:1.55;
            margin:0 0 30px;
        }

        /* ---------- Form fields (styles Django's {{ form.as_p }} generically) ---------- */
        .access-form p{ margin:0 0 20px; }

        .access-form label{
            display:block;
            font-family:'JetBrains Mono', monospace;
            font-size:11px;
            letter-spacing:1.3px;
            text-transform:uppercase;
            color:var(--ink-faint);
            margin-bottom:9px;
        }

        .access-form input{
            width:100%;
            font-family:'Inter', sans-serif;
            font-size:15px;
            padding:14px 16px;
            background:rgba(7,16,9,0.55);
            border:1px solid var(--line);
            border-radius:12px;
            color:var(--ink);
            outline:none;
            transition:border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .access-form input::placeholder{ color:var(--ink-faint); }
        .access-form input:focus{
            border-color:var(--gold);
            background:rgba(7,16,9,0.75);
            box-shadow:0 0 0 4px rgba(201,169,97,0.12);
        }

        .access-form .helptext{
            display:block;
            font-family:'JetBrains Mono', monospace;
            font-size:11px;
            color:var(--ink-faint);
            margin-top:7px;
        }

        .access-form ul.errorlist{
            list-style:none;
            margin:0 0 10px;
            padding:0;
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .access-form ul.errorlist li{
            font-family:'JetBrains Mono', monospace;
            font-size:12px;
            color:var(--flagged);
            background:rgba(255,92,114,0.08);
            border:1px solid rgba(255,92,114,0.3);
            padding:9px 12px;
            border-radius:8px;
        }

        /* ---------- Submit button ---------- */
        .btn-access{
            position:relative;
            overflow:hidden;
            font-family:'JetBrains Mono', monospace;
            font-weight:600;
            letter-spacing:1px;
            background:linear-gradient(180deg, var(--gold-bright), var(--gold));
            border:none;
            border-radius:12px;
            color:var(--void-deep);
            padding:16px 22px;
            width:100%;
            margin-top:6px;
            cursor:pointer;
            font-size:13.5px;
            text-transform:uppercase;
            transition:transform 0.15s, box-shadow 0.25s;
            box-shadow:0 14px 30px -14px rgba(201,169,97,0.55);
        }
        .btn-access:hover{ transform:translateY(-1px); box-shadow:0 18px 34px -14px rgba(201,169,97,0.7); }
        .btn-access:active{ transform:translateY(1px); }
        .btn-access:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
        .btn-access::before{
            content:'';
            position:absolute; top:0; left:-60%;
            width:40%; height:100%;
            background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
            transform:skewX(-20deg);
            animation:shimmer 3.2s ease-in-out infinite;
        }

        .access-footer{
            margin-top:24px;
            text-align:center;
            font-family:'JetBrains Mono', monospace;
            font-size:12.5px;
            color:var(--ink-faint);
        }
        .access-footer a{
            color:var(--gold-bright);
            text-decoration:none;
            border-bottom:1px dashed var(--line-bright);
            transition:border-color 0.2s, color 0.2s;
        }
        .access-footer a:hover{ color:var(--gold); border-bottom-color:var(--gold); }

        @keyframes riseIn{
            0%{ opacity:0; transform:translateY(14px); }
            100%{ opacity:1; transform:translateY(0); }
        }
        @keyframes badgeIn{
            0%{ opacity:0; transform:scale(0.6) rotate(-20deg); }
            100%{ opacity:1; transform:scale(1) rotate(0deg); }
        }
        @keyframes badgeRotate{
            0%{ transform:rotate(0deg); }
            100%{ transform:rotate(360deg); }
        }
        @keyframes shimmer{
            0%{ left:-60%; }
            45%{ left:120%; }
            100%{ left:120%; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-inner">
            <a href="/" class="header-brand">
                <span class="brand-mark"><span><i class="fa-solid fa-magnifying-glass"></i></span></span>
                <span class="brand-word">Truth<em>Lens</em></span>
            </a>
        </div>
    </header>

    <div class="access-wrap">
        <div class="access-card">
            <span class="access-eyebrow">Access request</span>

            <div class="access-badge">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h2>Login to TruthLens Lab</h2>
            <p class="access-tagline">Verify your identity to open a case.</p>

            <form method="post" class="access-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-access">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>&nbsp; Login
                </button>
            </form>

            <p class="access-footer">
                Don't have an account? <a href="/signup/">Sign up here</a>
            </p>
        </div>
    </div>

</body>
</html>
